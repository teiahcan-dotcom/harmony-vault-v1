<!DOCTYPE html>
<html>
<head>
<title>AI Guide Portal</title>
<style>
body {
    background: linear-gradient(to bottom, #050816, #0b1f3a);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
}
a { color: #c7d2fe; text-decoration: none; }
.box {
    margin: 40px auto;
    padding: 30px;
    max-width: 900px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
}
input, button {
    padding: 14px;
    border-radius: 10px;
    border: none;
    margin: 8px;
}
button {
    cursor: pointer;
}
</style>
</head>
<body>

<h1>AI Guide Portal</h1>

<div class="box">
<p>
This portal will eventually become the intelligent guide of Harmony Vault —
helping users find rooms, reflections, topics, and resources aligned with what they are seeking.
</p>

<input type="text" placeholder="What are you seeking today?">
<button>Ask the Guide</button>
</div>

<a href="index.html">← Back to Harmony Vault</a>

</body>
</html>
